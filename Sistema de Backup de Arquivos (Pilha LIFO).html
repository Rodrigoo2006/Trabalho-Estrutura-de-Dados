<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Backup de Arquivos</title>
    <style>
        /* Estilo simples de trabalho academico */
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
            color: #222;
            margin: 0;
            padding: 24px 12px;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        h1 {
            margin: 0 0 4px 0;
            font-size: 22px;
        }

        .subtitulo {
            margin: 0 0 18px 0;
            font-size: 14px;
            color: #555;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input[type="text"] {
            width: 100%;
            padding: 9px 10px;
            font-size: 14px;
            border: 1px solid #bbb;
            border-radius: 4px;
            margin-bottom: 12px;
        }

        .botoes {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
        }

        button {
            flex: 1;
            min-width: 160px;
            padding: 10px 12px;
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-push {
            background-color: #2563eb;
        }

        .btn-push:hover {
            background-color: #1d4ed8;
        }

        .btn-pop {
            background-color: #dc2626;
        }

        .btn-pop:hover {
            background-color: #b91c1c;
        }

        #mensagem {
            min-height: 20px;
            margin: 0 0 18px 0;
            padding: 8px 10px;
            font-size: 13px;
            font-family: monospace;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            color: #333;
        }

        h2 {
            margin: 0 0 10px 0;
            font-size: 17px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 6px;
        }

        .item-backup {
            padding: 10px;
            margin-bottom: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #fafafa;
            font-size: 14px;
            word-break: break-word;
        }

        .item-topo {
            border-color: #2563eb;
            background-color: #eff6ff;
        }

        .tag-topo {
            font-weight: bold;
            color: #1d4ed8;
            margin-right: 6px;
        }

        .vazio {
            font-size: 14px;
            color: #666;
            margin: 6px 0 0 0;
        }
    </style>
</head>
<body>
    <!-- Container principal centralizado -->
    <div class="container">
        <h1>Sistema de Backup de Arquivos</h1>
        <p class="subtitulo">Protótipo com Pilha (LIFO)</p>

        <!-- Formulario de entrada -->
        <label for="descricao">Descrição do backup:</label>
        <input
            type="text"
            id="descricao"
            placeholder="Ex: Versao inicial do codigo (v1)"
        >

        <div class="botoes">
            <button type="button" class="btn-push" onclick="criarBackup()">Criar Backup (Push)</button>
            <button type="button" class="btn-pop" onclick="restaurarBackup()">Restaurar Último (Pop)</button>
        </div>

        <!-- Area de status no estilo do console em C -->
        <p id="mensagem">Aguardando operacao...</p>

        <!-- Historico da Pilha (do topo para a base) -->
        <h2>Histórico de Backups</h2>
        <div id="historico">
            <p class="vazio">Historico vazio.</p>
        </div>
    </div>

    <script>
        // Estrutura da Pilha (LIFO) e contador de IDs
        const pilha = [];
        let contadorBackups = 0;

        const inputDescricao = document.getElementById("descricao");
        const paragrafoMensagem = document.getElementById("mensagem");
        const divHistorico = document.getElementById("historico");

        // Operacao Push: adiciona um novo backup no topo da pilha
        function criarBackup() {
            const desc = inputDescricao.value.trim();

            if (desc === "") {
                paragrafoMensagem.textContent = "[AVISO] Digite uma descricao.";
                inputDescricao.focus();
                return;
            }

            contadorBackups++;
            pilha.push({
                id: contadorBackups,
                descricao: desc
            });

            paragrafoMensagem.textContent = "[SUCESSO] Backup #" + contadorBackups + " criado!";
            inputDescricao.value = "";
            inputDescricao.focus();

            atualizarHistorico();
        }

        // Operacao Pop: remove e restaura o backup mais recente (topo)
        function restaurarBackup() {
            if (pilha.length === 0) {
                paragrafoMensagem.textContent = "[AVISO] Nenhum backup disponivel.";
                return;
            }

            const removido = pilha.pop();
            paragrafoMensagem.textContent =
                "[RESTAURACAO] Backup #" + removido.id + " restaurado: " + removido.descricao;

            atualizarHistorico();
        }

        // Exibe os backups na tela do topo (mais recente) ate a base (mais antigo)
        function atualizarHistorico() {
            divHistorico.innerHTML = "";

            if (pilha.length === 0) {
                const p = document.createElement("p");
                p.className = "vazio";
                p.textContent = "Historico vazio.";
                divHistorico.appendChild(p);
                return;
            }

            for (let i = pilha.length - 1; i >= 0; i--) {
                const backup = pilha[i];
                const isTopo = i === pilha.length - 1;

                const caixa = document.createElement("div");
                caixa.className = isTopo ? "item-backup item-topo" : "item-backup";

                if (isTopo) {
                    const tag = document.createElement("span");
                    tag.className = "tag-topo";
                    tag.textContent = "[TOPO]";
                    caixa.appendChild(tag);
                }

                const texto = document.createTextNode(
                    "Backup #" + backup.id + " - " + backup.descricao
                );
                caixa.appendChild(texto);

                divHistorico.appendChild(caixa);
            }
        }

        // Permite criar o backup pressionando a tecla Enter no campo de texto
        inputDescricao.addEventListener("keydown", function (evento) {
            if (evento.key === "Enter") {
                criarBackup();
            }
        });
    </script>
</body>
</html>
